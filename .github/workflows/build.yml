name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SING_BOX_VERSION: 1.14.4
  MIHOMO_VERSION: 1.19.33
  XRAY_VERSION: 26.10.21

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install sing-box, mihomo, Xray
        run: |
          mkdir -p "$HOME/bin" && cd "$(mktemp -d)"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" | tar xz
          mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" "$HOME/bin/"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-v${MIHOMO_VERSION}.gz" | gunzip > "$HOME/bin/mihomo"
          curl -fsSLo xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q xray.zip xray -d "$HOME/bin"
          chmod +x "$HOME/bin/"*
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test surge-api sing-box mihomo xray

      - name: Publish to release branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" release
